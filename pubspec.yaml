name: duggu
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The app's strings come from lib/l10n/app_en.arb (see l10n.yaml). Adding a
  # language is adding a file there, not hunting through the screens.
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  # State management
  provider: ^6.1.2

  # Fonts
  # Pinned below 9.0.0: that release rewired google_fonts onto the
  # material_ui fork, whose TextTheme is a different class from Flutter's
  # material TextTheme — ThemeData(textTheme:) no longer accepted it.
  # 8.2.1 is the last release that hands back a Flutter Material TextTheme.
  google_fonts: ^8.2.1

  # Utilities — 0.20.x requires Dart ^3.9.0, which Flutter 3.44+ (CI stable) provides.
  # The app only uses Intl.shortCurrency / number formatting.
  intl: ^0.20.0

  # HTTP calls (for future API integration)
  http: ^1.2.1

  # Backend (Supabase) — the plain Dart client (no supabase_flutter), since
  # this project only needs it to read products/categories and to sign in.
  supabase: ^2.6.0
  iconsax_flutter: ^1.0.1

  # Opens the app from the password-reset email link (com.duggustore.app://
  # reset-password) instead of leaving it to a browser. Pinned to this old
  # major version on purpose: 6.x's Android build.gradle reads compileSdk
  # from a `flutter { }` extension this project's Gradle setup never
  # provides ("compileSdkVersion is not specified"), where 3.5.1 still
  # hardcodes its own compileSdk and just works.
  app_links: ^7.2.2

  # Online payments (Razorpay Checkout), backed by the create-razorpay-order
  # / verify-razorpay-payment edge functions.
  razorpay_flutter: ^1.4.7

  # Push notifications: Firebase Cloud Messaging, with the heads-up drawn by
  # flutter_local_notifications. All of it self-disables until
  # android/app/google-services.json exists (see lib/services/push_service.dart).
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2

  # Picking images to upload to Supabase Storage (avatars, product photos).
  image_picker: ^1.1.2

  # Live order tracking map — OpenStreetMap tiles via flutter_map, so no
  # Google Maps API key is required.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  shared_preferences: 2.3.5
  share_plus: ^13.3.1
  pdf: ^3.11.1
  path_provider: ^2.1.3
  google_mlkit_subject_segmentation: ^0.2.1
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  google_mlkit_image_labeling: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  cached_network_image: ^4.0.3
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  lucide_icons_flutter: ^4.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  # flutter_gen removed — using native flutter gen-l10n (l10n.yaml)
  # flutter_gen: ^5.15.0

# geolocator_android 4.6.2+ reads `flutter.compileSdkVersion` in its own
# build.gradle, which Flutter 3.24 doesn't expose to library plugins.
dependency_overrides:
  geolocator_android: 4.6.1
  # Legacy (pre-pigeon) shared_preferences chain: the 2.5.x pigeon pair
  # throws NoSuchMethodError on getAll at runtime on some devices.
  shared_preferences_platform_interface: 2.4.1
  shared_preferences_android: 2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Every string the app shows is built from lib/l10n/*.arb.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/festival/
    # The app's faces, so google_fonts never downloads one: it finds a file
    # named like `Poppins-SemiBold.ttf` here and stops looking (the folder is
    # an asset, not a `fonts:` family, on purpose). lib/utils/app_fonts.dart
    # explains; test/fonts_test.dart checks every weight the code asks for.
    - assets/fonts/
    - assets/logo/
    - assets/onboarding/
    # The voice sheet's start and done chimes (lib/services/voice_sound.dart).
    - assets/sounds/

  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  # The bundled faces registered as proper families. Two jobs:
  # 1. A plain TextStyle that only asks for a weight (`FontWeight.w800`,
  #    without GoogleFonts) inherits the theme family; if that family is a
  #    single-face google_fonts variant, the engine fakes the bold up,
  #    painting fat synthetic strokes. Registered under one family name,
  #    the real face is picked for every weight instead.
  # 2. google_fonts gives its variants a fallback chain that ends in the
  #    plain family name, so a face that fails to load now degrades to the
  #    right family, not the system font.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic
