# Static check + widget tests for the Diwali festival home screen
# (`lib/diwali_festive/`).
#
# The repo's main Flutter CI is pinned to an older SDK than several app
# dependencies need, so `flutter pub get` fails there before the analyzer runs.
# `lib/diwali_festive/` deliberately imports only Flutter's own libraries, so
# this workflow copies the module, its fonts and `assets/diwali/` into a tiny
# throwaway package and runs the real checks on current stable Flutter.
# Nothing is installed into the repository.

name: Diwali festival screen check

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'arena/*']
    paths:
      - 'lib/diwali_festive/**'
      - 'test/diwali_festive_test.dart'
      - 'assets/diwali/**'
      - 'assets/fonts/**'
      - 'tools/diwali_festive_check_pubspec.yaml'
      - '.github/workflows/diwali-festive-analyze.yml'
  pull_request:
    paths:
      - 'lib/diwali_festive/**'
      - 'test/diwali_festive_test.dart'
      - 'assets/diwali/**'
      - 'assets/fonts/**'
      - 'tools/diwali_festive_check_pubspec.yaml'
      - '.github/workflows/diwali-festive-analyze.yml'

jobs:
  analyze-and-test:
    name: Analyze and test the festival screen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Assemble an isolated package
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/festive_check"
          mkdir -p "$PKG/lib/diwali_festive" "$PKG/test" "$PKG/assets"
          cp -R lib/diwali_festive/. "$PKG/lib/diwali_festive/"
          cp -R assets/diwali "$PKG/assets/diwali"
          cp -R assets/fonts "$PKG/assets/fonts"
          cp tools/diwali_festive_check_pubspec.yaml "$PKG/pubspec.yaml"
          # The test imports package:duggu/...; in the isolated package the
          # module is published under package:diwali_festive_check/... instead.
          sed 's|package:duggu/|package:diwali_festive_check/|g' \
            test/diwali_festive_test.dart > "$PKG/test/diwali_festive_test.dart"
          echo "FESTIVE_PKG=$PKG" >> "$GITHUB_ENV"
          find "$PKG" -maxdepth 2 -type d | sort

      - name: Get dependencies
        shell: bash
        run: cd "$FESTIVE_PKG" && flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$FESTIVE_PKG"
          # Capture the analyzer's exit status so the diagnostics are published
          # as annotations before the step fails.
          flutter analyze --no-fatal-infos > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 - <<'PY'
          import re
          text = open('analyze.txt', encoding='utf-8', errors='replace').read()
          lines = [l.strip() for l in text.splitlines() if ' \u2022 ' in l]
          problems = [l for l in lines if re.search(r'\b(error|warning) \u2022 ', l)]
          infos = [l for l in lines if l.startswith('info \u2022 ')]
          print('::notice::analyzer: %d problems, %d infos, %s' % (
              len(problems), len(infos), (text.strip().splitlines() or [''])[-1]))
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          if problems:
              print('::error::' + esc('\n'.join(problems)))
          PY
          if grep -qE '(error|warning) •' analyze.txt; then exit 1; fi

      - name: Test
        shell: bash
        run: |
          cd "$FESTIVE_PKG"
          STATUS=0
          flutter test test/diwali_festive_test.dart --reporter expanded > test.txt 2>&1 || STATUS=$?
          cat test.txt
          python3 - <<'PY'
          import re
          text = open('test.txt', encoding='utf-8', errors='replace').read()
          lines = text.splitlines()
          pattern = re.compile(
              r'overflowed by|error-causing widget|file:///.*\.dart:\d+'
              r'|\[E\]|Some tests failed|Failing tests|All tests passed'
              r'|Timer is still pending|Failed assertion|EXCEPTION CAUGHT')
          keep = [l.strip() for l in lines if pattern.search(l)]
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + esc('\n'.join(keep[:110])))
          print('::notice::' + esc('\n'.join(l.strip() for l in lines[-8:])))
          PY
          exit $STATUS
